schema_version: paos-robotwin20-readiness-live/v1
worker_id: robotwin20-readiness-live/v1
runtime_profile: ${ROBOTWIN20_RUNTIME_PROFILE}
embodiment_binding:
  robot_identity: franka-panda
  gripper_identity: panda-gripper
  embodiment_topology: two-single-arm
  planner_profile: curobo
  profile_digest: c96fa14de0a898a4d7c1de2b082e4eafb27f5d3ea8cf2ca31fc5cd9a7e000f4d

worker:
  python: ${ROBOTWIN20_RUNTIME_PYTHON}
  script: ${PAOS_ROBOTWIN20_ADAPTER_ROOT}/runtime/robotwin_readiness_worker.py
  cwd: ${PAOS_ROBOTWIN20_ADAPTER_ROOT}/runtime
  startup_timeout_s: 180
  request_timeout_s: 300
  shutdown_timeout_s: 10
  environment:
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: ${PAOS_ROBOTWIN20_ADAPTER_ROOT}/runtime:${PAOS_ROBOTWIN20_ADAPTER_ROOT}/src
  arguments:
    - --runtime-root
    - ${ROBOTWIN20_RUNTIME_ROOT}
    - --runtime-profile
    - ${ROBOTWIN20_RUNTIME_PROFILE}
    - --artifact-root
    - ${ROBOTWIN20_ARTIFACT_ROOT}
    - --calibration-ref
    - ${ROBOTWIN20_CALIBRATION_REF}
    - --worker-id
    - robotwin20-readiness-live/v1
    - --workspace-bounds
    - ${ROBOTWIN20_X_MIN_M}
    - ${ROBOTWIN20_X_MAX_M}
    - ${ROBOTWIN20_Y_MIN_M}
    - ${ROBOTWIN20_Y_MAX_M}
    - ${ROBOTWIN20_Z_MIN_M}
    - ${ROBOTWIN20_Z_MAX_M}
