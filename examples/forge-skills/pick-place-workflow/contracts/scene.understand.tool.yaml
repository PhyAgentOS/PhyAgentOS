tool_id: scene.understand
implementation_id: scene.understanding
endpoint_id: scene_understanding
operation: understand
semantics: query
description: Derive provider-neutral entity and relation claims from one named observation.
input_schema:
  type: object
  additionalProperties: false
  required: [observation_ref, scene_revision, frame_id, calibration_ref, freshness_ms, max_age_ms, artifacts]
  properties:
    observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
    scene_revision: {type: string, minLength: 1}
    frame_id: {type: string, minLength: 1}
    calibration_ref: {type: string, minLength: 1}
    freshness_ms: {type: integer, minimum: 0}
    max_age_ms: {type: integer, minimum: 1}
    artifacts:
      type: array
      minItems: 1
      items: {type: string, pattern: '^artifact://[^/]+/.+$'}
output_schema:
  type: object
  additionalProperties: false
  required: [status, observation_ref, scene_revision, frame, calibration_ref, entities, relations, spatial_envelopes, derived_artifacts, ambiguities]
  properties:
    status: {enum: [available, unavailable, stale, invalid]}
    observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
    scene_revision: {type: string, minLength: 1}
    frame:
      type: object
      additionalProperties: false
      required: [frame_id, unit]
      properties:
        frame_id: {type: string, minLength: 1}
        unit: {const: m}
    calibration_ref: {type: [string, 'null']}
    entities:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [entity_ref, category, confidence, provenance]
        properties:
          entity_ref: {type: string, pattern: '^entity://[^/]+$'}
          category: {type: string, minLength: 1}
          confidence: {type: number, minimum: 0, maximum: 1}
          provenance:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
    relations:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [relation_ref, subject_ref, predicate, object_ref, confidence, provenance]
        properties:
          relation_ref: {type: string, pattern: '^relation://[^/]+$'}
          subject_ref: {type: string, pattern: '^entity://[^/]+$'}
          predicate: {type: string, minLength: 1}
          object_ref: {type: string, pattern: '^entity://[^/]+$'}
          confidence: {type: number, minimum: 0, maximum: 1}
          provenance:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
    spatial_envelopes:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [entity_ref, frame_id, unit, min_xyz_m, max_xyz_m, confidence, provenance]
        properties:
          entity_ref: {type: string, pattern: '^entity://[^/]+$'}
          frame_id: {type: string, minLength: 1}
          unit: {const: m}
          min_xyz_m: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
          max_xyz_m: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
          confidence: {type: number, minimum: 0, maximum: 1}
          provenance:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
    derived_artifacts:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [artifact_ref, kind, media_type, observation_ref, scene_revision, entity_ref, frame_id, calibration_ref, source_refs, provenance, descriptor]
        properties:
          artifact_ref: {type: string, pattern: '^artifact://[^/]+/.+$'}
          kind: {enum: [instance_mask, object_point_cloud, metric_localization]}
          media_type: {type: string, minLength: 1}
          observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
          scene_revision: {type: string, minLength: 1}
          entity_ref: {type: string, pattern: '^entity://[^/]+$'}
          frame_id: {type: string, minLength: 1}
          calibration_ref: {type: string, minLength: 1}
          source_refs:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
          provenance:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
          descriptor:
            type: object
            additionalProperties: false
            required: [width_px, height_px, bbox_xyxy_px, foreground_pixels, point_count, unit, min_xyz_m, max_xyz_m, confidence]
            properties:
              width_px: {type: [integer, 'null'], minimum: 1}
              height_px: {type: [integer, 'null'], minimum: 1}
              bbox_xyxy_px:
                type: [array, 'null']
                minItems: 4
                maxItems: 4
                items: {type: integer, minimum: 0}
              foreground_pixels: {type: [integer, 'null'], minimum: 1}
              point_count: {type: [integer, 'null'], minimum: 1}
              unit: {type: [string, 'null'], enum: [m, null]}
              min_xyz_m:
                type: [array, 'null']
                minItems: 3
                maxItems: 3
                items: {type: number}
              max_xyz_m:
                type: [array, 'null']
                minItems: 3
                maxItems: 3
                items: {type: number}
              confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
    ambiguities:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [code, message, entity_refs]
        properties:
          code: {type: string, minLength: 1}
          message: {type: string, minLength: 1}
          entity_refs:
            type: array
            items: {type: string, pattern: '^entity://[^/]+$'}
    error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
robot_frame_profile:
  observation_frame: observation
  unit: m
