tool_id: manipulation.prepare
implementation_id: manipulation.preparation
endpoint_id: manipulation_preparation
operation: prepare
semantics: query
description: Evaluate non-mutating workspace, kinematic, and collision readiness for one grasp candidate set without authorizing or producing motion.
input_schema:
  type: object
  additionalProperties: false
  required: [observation_ref, scene_revision, frame_id, calibration_ref, freshness_ms, max_age_ms, candidate_set_ref, candidates]
  properties:
    observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
    scene_revision: {type: string, minLength: 1}
    frame_id: {type: string, minLength: 1}
    calibration_ref: {type: string, minLength: 1}
    freshness_ms: {type: integer, minimum: 0}
    max_age_ms: {type: integer, minimum: 1}
    candidate_set_ref: {type: string, pattern: '^candidate-set://[^/]+/.+$'}
    candidates:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [candidate_ref, entity_ref, grasp_frame, approach_direction, score, confidence, provenance, qualification]
        properties:
          candidate_ref: {type: string, pattern: '^candidate://[^/]+/.+$'}
          entity_ref: {type: string, pattern: '^entity://[^/]+$'}
          grasp_frame:
            type: object
            additionalProperties: false
            required: [frame_id, unit, position_m, orientation_xyzw]
            properties:
              frame_id: {type: string, minLength: 1}
              unit: {const: m}
              position_m: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
              orientation_xyzw: {type: array, minItems: 4, maxItems: 4, items: {type: number}}
          approach_direction:
            type: object
            additionalProperties: false
            required: [frame_id, unit, vector]
            properties:
              frame_id: {type: string, minLength: 1}
              unit: {const: unitless}
              vector: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
          score: {type: number, minimum: 0, maximum: 1}
          confidence: {type: number, minimum: 0, maximum: 1}
          provenance:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
          qualification: {enum: [proposed, low_confidence, ambiguous]}
output_schema:
  type: object
  additionalProperties: false
  required: [status, preparation_ref, candidate_set_ref, observation_ref, scene_revision, frame, calibration_ref, prepared_candidates, checks, evidence, motion_authorized]
  properties:
    status:
      enum: [available, empty, unavailable, stale, invalid]
    preparation_ref: {type: string, pattern: '^preparation://[^/]+/.+$'}
    candidate_set_ref: {type: string, pattern: '^candidate-set://[^/]+/.+$'}
    observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
    scene_revision: {type: string, minLength: 1}
    frame:
      type: object
      additionalProperties: false
      required: [frame_id, unit]
      properties:
        frame_id: {type: string, minLength: 1}
        unit: {const: m}
    calibration_ref: {type: [string, 'null']}
    prepared_candidates:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [candidate_ref, entity_ref, checks, evidence, qualification]
        properties:
          candidate_ref: {type: string, pattern: '^candidate://[^/]+/.+$'}
          entity_ref: {type: string, pattern: '^entity://[^/]+$'}
          checks:
            type: object
            additionalProperties: false
            required: [kinematic, collision, workspace]
            properties:
              kinematic: {enum: [pass, fail, unknown]}
              collision: {enum: [pass, fail, unknown]}
              workspace: {enum: [pass, fail, unknown]}
          evidence:
            type: array
            minItems: 1
            items: {type: string, pattern: '^artifact://[^/]+/.+$'}
          qualification: {enum: [prepared]}
    checks:
      type: object
      additionalProperties: false
      required: [kinematic, collision, workspace]
      properties:
        kinematic: {enum: [pass, fail, unknown]}
        collision: {enum: [pass, fail, unknown]}
        workspace: {enum: [pass, fail, unknown]}
    evidence:
      type: array
      items: {type: string, pattern: '^artifact://[^/]+/.+$'}
    motion_authorized: {const: false}
    error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
robot_frame_profile:
  observation_frame: observation
  unit: m
