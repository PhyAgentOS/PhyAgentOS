manifest_version: 2
name: move-arm-by-ee
version: "0.2.0"
description: Resolve relative end-effector motion and control the gripper opening.
skill_document: SKILL.md
gateway_url: http://127.0.0.1:19002
required_tools:
  - motion.resolve_relative_pose
  - motion.move_pose
  - gripper.set_opening
profiles:
  mujoco:
    dataflow: profiles/mujoco/dataflow.yaml
    required_binaries:
      - gateway
      - relative_pose_policy
      - motion_action_policy
      - motion_server
      - joint_trajectory_controller
      - gripper_action_policy
      - gripper_action_controller
      - mujoco_sim
      - image_viewer
    required_assets:
      - assets/piper_with_gripper.urdf
      - assets/piper_mujoco/scene.xml
      - assets/piper_mujoco/PIPER.xml
    required_environment: []
    environment: {}
